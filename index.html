<script>
/* ================== ตั้งค่าพื้นฐานและข้อมูลหลัก ================== */
const DBKEY='stat6u2_db_v1';
const ADMIN_USER='admin', ADMIN_PASS='1234';

function loadDB(){
  try{
    const d=JSON.parse(localStorage.getItem(DBKEY));
    if(d&&d.students){
      d.settings=Object.assign({
        passPct:60, 
        finalPassPct:70,
        subjectName:'คณิตศาสตร์เพิ่มเติม 6',
        subjectCode:'ค33202',
        gradeLevel:'ชั้นมัธยมศึกษาปีที่ 6',
        unitName:'หน่วยการเรียนรู้ที่ 1 สถิติศาสตร์และข้อมูล',
        teacherName:'จิรพันธ์ บัวแก้ว',
        teacherPos:'ครูผู้สอน'
      }, d.settings||{});
      return d;
    }
  }catch(e){}
  return {
    students:{},
    settings:{
      passPct:60,
      finalPassPct:70,
      subjectName:'คณิตศาสตร์เพิ่มเติม 6',
      subjectCode:'ค33202',
      gradeLevel:'ชั้นมัธยมศึกษาปีที่ 6',
      unitName:'หน่วยการเรียนรู้ที่ 1 สถิติศาสตร์และข้อมูล',
      teacherName:'จิรพันธ์ บัวแก้ว',
      teacherPos:'ครูผู้สอน'
    }
  };
}

let DB=loadDB();
function saveDB(){localStorage.setItem(DBKEY,JSON.stringify(DB));}
let ME=sessionStorage.getItem('stat6_me2');
let QUIZ=null;
const app=document.getElementById('app');
function me(){return DB.students[ME];}
function view(html){app.innerHTML=html;window.scrollTo(0,0);document.getElementById('pageTitle').textContent=`${DB.settings.unitName} - ${DB.settings.subjectCode} ${DB.settings.subjectName} ${DB.settings.gradeLevel}`;}

/* ================== โครงสร้างบทเรียน ================== */
const SECTIONS=[
 {key:'s1',no:1,title:'บทนำและสถิติศาสตร์',icon:'📊',color:'#6366f1',desc:'ความหมาย องค์ประกอบ 5 ขั้นตอน และประโยชน์ของสถิติศาสตร์'},
 {key:'s2',no:2,title:'คำสำคัญในสถิติศาสตร์',icon:'🔑',color:'#0ea5e9',desc:'ประชากร ตัวอย่าง ตัวแปร ข้อมูล พารามิเตอร์ และค่าสถิติ'},
 {key:'s3',no:3,title:'ประเภทของข้อมูล',icon:'🗂️',color:'#10b981',desc:'จำแนกตามแหล่งที่มา ตามระยะเวลา และตามลักษณะของข้อมูล'},
 {key:'s4',no:4,title:'สถิติศาสตร์เชิงพรรณนาและเชิงอนุมาน',icon:'🔍',color:'#f59e0b',desc:'ความแตกต่างของสถิติ 2 ประเภท และการนำไปใช้'}

<li><span class="nd l2">1. ตามแหล่งที่มา</span><ul><li><span class="nd l3">ข้อมูลปฐมภูมิ</span></li><li><span class="nd l3">ข้อมูลทุติยภูมิ</span></li></ul></li>
<li><span class="nd l2">2. ตามระยะเวลา</span><ul><li><span class="nd l3">ข้อมูลตัดขวาง</span></li><li><span class="nd l3">ข้อมูลอนุกรมเวลา</span></li></ul></li>
<li><span class="nd l2">3. ตามลักษณะของข้อมูล</span><ul><li><span class="nd l3">เชิงปริมาณ</span> → แบบไม่ต่อเนื่อง / แบบต่อเนื่อง</li><li><span class="nd l3">เชิงคุณภาพ</span></li></ul></li>
</ul></li></ul></div></section>
<section class="card"><h3>1️⃣ จำแนกตามแหล่งที่มา</h3><div class="two">
<div class="box"><h4>📝 ข้อมูลปฐมภูมิ (Primary Data)</h4>ข้อมูลที่ผู้ศึกษา<b>เก็บรวบรวมเองโดยตรง</b>จากแหล่งต้นกำเนิด<br><small class="mut">เช่น การสัมภาษณ์ แบบสอบถาม การสังเกต การทดลอง</small></div>
<div class="box"><h4>📚 ข้อมูลทุติยภูมิ (Secondary Data)</h4>ข้อมูลที่<b>มีผู้รวบรวมไว้อยู่แล้ว</b><br><small class="mut">เช่น รายงานจากหน่วยงานราชการ สถิติจากเว็บไซต์ทางการ งานวิจัยที่เผยแพร่แล้ว</small></div>
</div>${actBox('a-source','ปฐมภูมิหรือทุติยภูมิ?','จำแนกข้อมูลแต่ละข้อ')}</section>
<section class="card"><h3>2️⃣ จำแนกตามระยะเวลา</h3><div class="two">
<div class="box"><h4>📸 ข้อมูลตัดขวาง (Cross-sectional)</h4>ข้อมูลที่เก็บ <b>ณ จุดเวลาใดเวลาหนึ่ง</b><br><small class="mut">เช่น จำนวนนักเรียนแต่ละชั้นในปีการศึกษานี้</small></div>
<div class="box"><h4>📈 ข้อมูลอนุกรมเวลา (Time Series)</h4>ข้อมูลที่เก็บ <b>ต่อเนื่องตามลำดับเวลา</b><br><small class="mut">เช่น ยอดขายรายเดือน อุณหภูมิรายวัน</small></div>
</div>${actBox('a-time','ตัดขวางหรืออนุกรมเวลา?','จำแนกข้อมูลแต่ละข้อ')}</section>
<section class="card"><h3>3️⃣ จำแนกตามลักษณะของข้อมูล</h3><div class="two">
<div class="box"><h4>🔢 ข้อมูลเชิงปริมาณ (Quantitative)</h4>วัดหรือนับออกมาเป็นตัวเลขได้
<ul><li><b>แบบไม่ต่อเนื่อง (Discrete):</b> เป็นจำนวนนับหรือจำนวนเต็ม เช่น จำนวนนักเรียน จำนวนรถยนต์ที่ผ่านสี่แยก จำนวนไข่ไก่ที่เก็บได้ใน 1 วัน</li>
<li><b>แบบต่อเนื่อง (Continuous):</b> มีค่าได้ทุกค่าในช่วงที่กำหนด มีทศนิยมได้ (มาจากการวัด) เช่น น้ำหนัก ส่วนสูง อุณหภูมิ</li></ul></div>
<div class="box"><h4>🎨 ข้อมูลเชิงคุณภาพ (Qualitative)</h4>อธิบายลักษณะ ประเภท หรือสมบัติ <b>ไม่สามารถนำมาบวก ลบ คูณ หาร ได้</b><br><small class="mut">เช่น สี เพศ ประเภทสินค้า กรุ๊ปเลือด</small></div>
</div><div class="tip">💡 <b>เทคนิคจำ:</b> “<b>นับ</b>” → ไม่ต่อเนื่อง, “<b>วัด</b>” → ต่อเนื่อง, “<b>บอกลักษณะ</b>” → เชิงคุณภาพ</div>
${actBox('a-nature','จำแนกตามลักษณะของข้อมูล','เลือกประเภทให้ข้อมูลแต่ละข้อ')}</section>`,

/* ================== กิจกรรมโต้ตอบ ================== */
function mountOrder(id,steps){
 const el=document.getElementById(id);if(!el)return;let next=0;
 const items=shuffle(steps.map((t,i)=>({t,i})));
 el.innerHTML=`<div class="ordans" id="${id}-ans"></div><div class="pool">${items.map(o=>`<button class="pbtn" data-i="${o.i}">${o.t}</button>`).join('')}</div><div class="fb" id="${id}-fb"></div><button class="btn sm ghost" id="${id}-rs">↺ เริ่มใหม่</button>`;
 const fb=document.getElementById(id+'-fb');
 el.querySelectorAll('.pool .pbtn').forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i;
  if(i===next){b.disabled=true;b.classList.add('ok');document.getElementById(id+'-ans').insertAdjacentHTML('beforeend',`<div><span>${next+1}</span>${steps[i]}</div>`);next++;
   if(next===steps.length){fb.className='fb ok';fb.textContent='🎉 ยอดเยี่ยม! เรียงครบทั้ง 5 ขั้นตอนถูกต้อง';}else{fb.className='fb ok';fb.textContent='✔ ถูกต้อง! ขั้นตอนที่ '+(next+1)+' คืออะไร?';}}
  else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');fb.className='fb bad';fb.textContent='✘ ยังไม่ใช่ขั้นตอนที่ '+(next+1)+' ลองใหม่นะ';}
 });
 document.getElementById(id+'-rs').onclick=()=>mountOrder(id,steps);
}
function mountMatch(id,pairs){
 const el=document.getElementById(id);if(!el)return;
 const L=shuffle(pairs.map((p,i)=>({t:p[0],i}))),R=shuffle(pairs.map((p,i)=>({t:p[1],i})));
 el.innerHTML=`<div class="match"><div class="col">${L.map(o=>`<button class="pbtn" data-s="L" data-i="${o.i}">${o.t}</button>`).join('')}</div><div class="col">${R.map(o=>`<button class="pbtn" data-s="R" data-i="${o.i}">${o.t}</button>`).join('')}</div></div><div class="fb" id="${id}-fb"></div><button class="btn sm ghost" id="${id}-rs">↺ เริ่มใหม่</button>`;
 let sel=null,done=0,miss=0;const fb=document.getElementById(id+'-fb');
 el.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{
  if(b.disabled)return;
  if(b.dataset.s==='L'){el.querySelectorAll('[data-s=L]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;return;}
  if(!sel){fb.className='fb bad';fb.textContent='เลือกคำศัพท์ทางซ้ายก่อนนะ';return;}
  if(b.dataset.i===sel.dataset.i){[b,sel].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true;});sel=null;done++;
   fb.className='fb ok';fb.textContent=done===pairs.length?`🎉 จับคู่ครบทั้ง ${pairs.length} คู่! (ผิด ${miss} ครั้ง)`:`✔ ถูกต้อง! (${done}/${pairs.length})`;}
  else{miss++;b.classList.add('bad','shake');setTimeout(()=>b.classList.remove('bad','shake'),500);fb.className='fb bad';fb.textContent='✘ ยังไม่ตรงกัน ลองใหม่';}
 });
 document.getElementById(id+'-rs').onclick=()=>mountMatch(id,pairs);
}
function mountClassify(id,cats,items){
 const el=document.getElementById(id);if(!el)return;
 const list=shuffle(items);let ans=0,ok=0;
 el.innerHTML=list.map((it,k)=>`<div class="cls-row" id="${id}-r${k}"><div class="cls-t">${k+1}. ${fmt(it.t)}</div><div class="cls-btns">${cats.map((c,ci)=>`<button class="pbtn" data-k="${k}" data-c="${ci}">${c}</button>`).join('')}</div><div class="cls-e"></div></div>`).join('')+`<div class="fb" id="${id}-fb"></div>`;
 el.querySelectorAll('.cls-btns .pbtn').forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k,c=+b.dataset.c,row=document.getElementById(id+'-r'+k);
  if(row.dataset.done)return;row.dataset.done=1;ans++;const it=list[k];
  row.querySelectorAll('.pbtn').forEach(x=>{x.disabled=true;if(+x.dataset.c===it.a)x.classList.add('ok');});
  if(c===it.a){ok++;row.classList.add('ok');row.querySelector('.cls-e').innerHTML='✔ ถูกต้อง '+(it.e?fmt(it.e):'');}
  else{b.classList.add('bad');row.classList.add('bad');row.querySelector('.cls-e').innerHTML='✘ คำตอบที่ถูกคือ <b>'+cats[it.a]+'</b> '+(it.e?'· '+fmt(it.e):'');}
  const fb=document.getElementById(id+'-fb');
  if(ans===list.length){fb.className='fb '+(ok===list.length?'ok':'');fb.innerHTML=`ได้ ${ok}/${list.length} ข้อ ${ok===list.length?'🎉 เยี่ยมมาก!':'💪 '} <button class="btn sm ghost" onclick='mountClassify("${id}",${JSON.stringify(cats)},${JSON.stringify(items).replace(/'/g,"&#39;")})'>↺ ลองอีกครั้ง</button>`;}
  else{fb.className='fb';fb.textContent=`ทำแล้ว ${ans}/${list.length} · ถูก ${ok} ข้อ`;}
 });
}

/* ================== สถานะนักเรียน ================== */
function passed(s,k){return !!(s&&s.quizzes&&s.quizzes[k]&&s.quizzes[k].passed);}
function unlocked(s,i){return i===0||passed(s,SECTIONS[i-1].key);}
function allSec(s){return SECTIONS.every(x=>passed(s,x.key));}
function progressPct(s){const n=SECTIONS.filter(x=>passed(s,x.key)).length+(passed(s,'final')?1:0);return Math.round(n/5*100);}

function formatX(str){
  const xbarHtml = '<span style="display:inline-block;position:relative;"><span style="position:absolute;top:-8px;left:0;right:0;text-align:center;font-size:14px;line-height:1;">¯</span>x</span>';
  return String(str).replace(/\{xbar\}/g, xbarHtml);
}
function fmt(s){return formatX(s);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function thDate(iso){return new Date(iso).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});}
function thDT(iso){return new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});}

function header(){
  const s=me();const p=progressPct(s);
  const st=DB.settings;
  return `<header class="topbar no-print"><div class="brand" onclick="goHome()">📊 ${st.subjectCode} ${st.subjectName}</div><div class="tb-prog"><div class="pbar"><i style="width:${p}%"></i></div><small><b>${p}%</b></small></div><div class="tb-user">👤 ${esc(s.name)} <button class="btn sm ghost" onclick="logout()">ออกจากระบบ</button></div></header>`;
}

/* ================== ระบบแบบทดสอบ ================== */
function startQuiz(key){
 const s=me();const isF=key==='final';
 if(isF&&!allSec(s)){toast('ต้องผ่านครบ 4 ส่วนก่อน');return;}
 const bank=isF?FINAL_BANK:BANK[key],n=isF?10:5;
 const idx=shuffle(bank.map((_,i)=>i)).slice(0,n);
 QUIZ={key,n,items:idx.map(i=>({q:bank[i].q,e:bank[i].e,opts:shuffle(bank[i].c.map((t,j)=>({t,ok:j===0})))})),ans:Array(n).fill(null),
  code:key.toUpperCase()+'-'+idx.map(i=>i.toString(36)).join('').toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase()};
 const sec=isF?null:SECTIONS.find(x=>x.key===key);
 const title=isF?'แบบทดสอบประมวลความรู้ความเข้าใจ':`แบบทดสอบย่อย ส่วนที่ ${sec.no}: ${sec.title}`;
 const thr=isF?DB.settings.finalPassPct:DB.settings.passPct;
 view(header()+`<main class="wrap"><div class="card quiz-head"><div><small>📝 ${isF?'ครอบคลุมทุกส่วน · 10 ข้อ':'5 ข้อ'} · สุ่มจากคลัง ${bank.length} ข้อ</small><h2>${title}</h2><div style="font-size:15px">เกณฑ์ผ่าน ${thr}% · รหัสชุดข้อสอบ <code>${QUIZ.code}</code></div></div><div class="qcount" id="qcount">0/${n}</div></div>
 ${QUIZ.items.map((it,qi)=>`<div class="card" id="q${qi}"><div class="qnum">ข้อที่ ${qi+1}</div><div class="qtext">${fmt(it.q)}</div><div class="opts">${it.opts.map((o,oi)=>`<button class="opt" id="q${qi}o${oi}" onclick="pick(${qi},${oi})"><span class="ol">${'กขคง'[oi]}</span><span>${fmt(o.t)}</span></button>`).join('')}</div></div>`).join('')}
 <div class="center"><button class="btn ok" style="padding:13px 34px;font-size:18px" onclick="submitQuiz()">✔ ส่งคำตอบ</button><button class="btn ghost" onclick="${isF?'goHome()':`openLesson(${SECTIONS.findIndex(x=>x.key===key)})`}">ยกเลิก</button></div></main>`);
}
function pick(qi,oi){QUIZ.ans[qi]=oi;for(let j=0;j<4;j++){const b=document.getElementById(`q${qi}o${j}`);if(b)b.classList.toggle('sel',j===oi);}
 document.getElementById('qcount').textContent=QUIZ.ans.filter(a=>a!==null).length+'/'+QUIZ.n;}
function submitQuiz(){
 const miss=QUIZ.ans.findIndex(a=>a===null);
 if(miss>=0){toast('กรุณาตอบให้ครบทุกข้อ (ยังไม่ได้ตอบข้อ '+(miss+1)+')');document.getElementById('q'+miss).scrollIntoView({behavior:'smooth',block:'center'});return;}
 const s=me(),key=QUIZ.key,n=QUIZ.n,isF=key==='final';
 const score=QUIZ.items.reduce((a,it,i)=>a+(it.opts[QUIZ.ans[i]].ok?1:0),0);
 const pct=Math.round(score/n*100),thr=isF?DB.settings.finalPassPct:DB.settings.passPct,pass=pct>=thr;
 const now=new Date().toISOString();
 const r=s.quizzes[key]||{attempts:0,best:0,last:0,total:n,passed:false,history:[]};
 r.attempts++;r.last=score;r.best=Math.max(r.best,score);r.total=n;if(pass)r.passed=true;
 r.history.push({d:now,score,total:n,code:QUIZ.code,pass});s.quizzes[key]=r;s.updated=now;
 if(isF&&pass){if(!s.cert){const y=new Date().getFullYear()+543;s.cert={no:`CERT-${y}-${Math.random().toString(36).slice(2,7).toUpperCase()}`,date:now,score,total:n};}else if(score>s.cert.score){s.cert.score=score;}}
 saveDB();renderResult(score,n,pct,pass,thr);
}
function renderResult(score,n,pct,pass,thr){
 const key=QUIZ.key,isF=key==='final',s=me();const i=SECTIONS.findIndex(x=>x.key===key);
 let btns=`<button class="btn ghost" onclick="startQuiz('${key}')">🎲 ทำใหม่ (สุ่มชุดใหม่)</button>`;
 if(!isF)btns+=`<button class="btn ghost" onclick="openLesson(${i})">📖 ทบทวนบทเรียน</button>`;
 if(pass&&!isF&&i<3)btns+=`<button class="btn" onclick="openLesson(${i+1})">ไปส่วนที่ ${i+2} →</button>`;
 if(pass&&!isF&&allSec(s))btns+=`<button class="btn" onclick="renderSummary()">🗒️ ดูการ์ดสรุป</button>`;
 if(isF&&pass)btns+=`<button class="btn gold" onclick="renderCert(ME)">🏅 รับเกียรติบัตร</button>`;
 btns+=`<button class="btn ghost" onclick="goHome()">🏠 หน้าหลัก</button>`;
 view(header()+`<main class="wrap"><div class="card res-top"><div class="ring ${pass?'pass':'fail'}"><b>${score}/${n}</b><span>${pct}%</span></div>
 <h2>${pass?'🎉 ยินดีด้วย! คุณผ่านแบบทดสอบ':'💪 ยังไม่ผ่านเกณฑ์ ลองอีกครั้งนะ'}</h2>
 <p class="mut">เกณฑ์ผ่าน ${thr}% · รหัสชุดข้อสอบ <code>${QUIZ.code}</code></p>
 ${pass&&!isF&&i<3?`<p>🔓 ปลดล็อก <b>ส่วนที่ ${i+2}: ${SECTIONS[i+1].title}</b> แล้ว</p>`:''}
 ${pass&&!isF&&allSec(s)?'<p>🔓 เรียนครบทั้ง 4 ส่วนแล้ว ปลดล็อก <b>การ์ดสรุป</b> และ <b>แบบทดสอบประมวลความรู้</b></p>':''}
 <div>${btns}</div></div>
 <h3>🔎 เฉลยและคำอธิบาย</h3>
 ${QUIZ.items.map((it,qi)=>{const a=QUIZ.ans[qi],ok=it.opts[a].ok;return `<div class="card"><div class="qnum">ข้อที่ ${qi+1} ${ok?'<span class="chip pass">ถูก</span>':'<span class="chip" style="background:#fee2e2;color:#b91c1c">ผิด</span>'}</div><div class="qtext">${fmt(it.q)}</div><div class="opts">${it.opts.map((o,oi)=>`<div class="opt ${o.ok?'right':(oi===a?'wrong':'')}"><span class="ol">${'กขคง'[oi]}</span><span>${fmt(o.t)} ${o.ok?' ✔':''}${oi===a&&!o.ok?' (คำตอบของคุณ)':''}</span></div>`).join('')}</div><div class="exp">💡 ${fmt(it.e)}</div></div>`;}).join('')}
 <div class="center">${btns}</div></main>`);
 if(pass)confetti();
}

  <div class="cert-name">${esc(s.name)}</div>
  <div class="cert-body">${s.room?'นักเรียนชั้น '+esc(s.room)+(s.no?' เลขที่ '+esc(s.no):'')+'<br>':''}
  ได้ผ่านการเรียนรู้และการประเมินผล บทเรียนออนไลน์ รายวิชา ${st.subjectName} (${st.subjectCode}) ${st.gradeLevel}<br>
  <b>${st.unitName}</b> ครบทั้ง 4 ส่วน<br>
  ด้วยคะแนนแบบทดสอบประมวลความรู้ความเข้าใจ <b>${c.score}/${c.total} คะแนน (${pct}%)</b><br>
  ให้ไว้ ณ วันที่ ${thDate(c.date)}</div>
  <div class="cert-sign"><div class="certno">เลขที่เกียรติบัตร<br><b>${c.no}</b></div>
   <div class="seal"><b>ผ่าน</b>${st.subjectCode}<br>หน่วยที่ 1</div>
   <div class="sig"><div class="sg">${st.teacherName}</div><div class="ln">( ${st.teacherName} )<br>${st.teacherPos}</div></div></div>
 </div></div></div></main>`);
 if(!fromAdmin)confetti();
}

/* ================== ระบบผู้ดูแล ================== */
function openAdminLogin(){
 modal(`<h2>🔐 เข้าสู่ระบบผู้ดูแล</h2><form onsubmit="adminLogin();return false;"><label>ชื่อผู้ใช้</label><input id="admU" autocomplete="off"><label>รหัสผ่าน</label><input id="admP" type="password">
 <div style="margin-top:16px;text-align:right"><button type="button" class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn" type="submit">เข้าสู่ระบบ</button></div></form>`);
 setTimeout(()=>document.getElementById('admU').focus(),50);
}
function adminLogin(){
 if(document.getElementById('admU').value.trim()===ADMIN_USER&&document.getElementById('admP').value===ADMIN_PASS){sessionStorage.setItem('stat6_admin2','1');closeModal();renderAdmin();}
 else toast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
}
function adminLogout(){sessionStorage.removeItem('stat6_admin2');renderLogin();}
function adminHeader(){return `<header class="topbar no-print" style="background:#1e1b4b;color:#fff"><div class="brand" style="color:#fff" onclick="renderAdmin()">🛡️ ระบบผู้ดูแล · ${DB.settings.subjectCode} ${DB.settings.subjectName}</div><div style="flex:1"></div><button class="btn sm ghost" onclick="adminLogout()">ออกจากระบบ</button></header>`;}

let ADMTAB='students';
function renderAdmin(tab){
 if(sessionStorage.getItem('stat6_admin2')!=='1'){renderLogin();return;}
 if(tab)ADMTAB=tab;DB=loadDB();
 const list=Object.values(DB.students);
 const nAll=list.length,nSec=list.filter(allSec).length,nCert=list.filter(s=>s.cert).length;
 const fs=list.filter(s=>s.quizzes.final).map(s=>s.quizzes.final.best);
 const avg=fs.length?(fs.reduce((a,b)=>a+b,0)/fs.length).toFixed(1):'—';
 const st=DB.settings;
 const tabs=[['students','👥 ผลการเรียน'],['bank','📚 คลังข้อสอบ'],['settings','⚙️ ตั้งค่าและรายละเอียดวิชา']].map(t=>`<button class="${ADMTAB===t[0]?'on':''}" onclick="renderAdmin('${t[0]}')">${t[1]}</button>`).join('');
 let body='';
 if(ADMTAB==='students'){
  body=`<div class="stats"><div class="stat">นักเรียนทั้งหมด<b>${nAll}</b></div><div class="stat">เรียนครบ 4 ส่วน<b>${nSec}</b></div><div class="stat">ได้รับเกียรติบัตร<b>${nCert}</b></div><div class="stat">คะแนนประมวลเฉลี่ย (สูงสุดของแต่ละคน)<b>${avg}</b></div></div>
  <div class="card"><div class="toolbar"><input id="admQ" placeholder="🔎 ค้นหาชื่อ / ชั้น" oninput="fillAdminTable()"><select id="admF" onchange="fillAdminTable()" style="max-width:220px"><option value="">ทุกสถานะ</option><option value="cert">ได้รับเกียรติบัตร</option><option value="sec">เรียนครบ รอสอบประมวล</option><option value="learn">กำลังเรียน</option></select><div style="flex:1"></div>
  <button class="btn sm ok" onclick="exportCSV()">⬇️ ส่งออก CSV (Excel)</button><button class="btn sm bad" onclick="clearAll()">🗑️ ล้างข้อมูลทั้งหมด</button></div>
  <div class="tbl-wrap"><table class="adm"><thead><tr><th>#</th><th>ชื่อ-นามสกุล</th><th>ชั้น</th><th>เลขที่</th><th>ส่วน 1</th><th>ส่วน 2</th><th>ส่วน 3</th><th>ส่วน 4</th><th>ประมวล</th><th>สถานะ</th><th>ใช้งานล่าสุด</th><th>จัดการ</th></tr></thead><tbody id="admBody"></tbody></table></div>
  <p class="mut" style="font-size:13.5px">คะแนนแสดงเป็นคะแนนสูงสุด (จำนวนครั้งที่สอบ) · ✔ = ผ่านเกณฑ์ · ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้</p></div>`;
 }else if(ADMTAB==='bank'){
  const blocks=[...SECTIONS.map(x=>[`ส่วนที่ ${x.no}: ${x.title} (สุ่ม 5 จาก ${BANK[x.key].length} ข้อ)`,BANK[x.key]]),[`แบบทดสอบประมวลความรู้ (สุ่ม 10 จาก ${FINAL_BANK.length} ข้อ)`,FINAL_BANK]];
  body=blocks.map(b=>`<div class="card"><h3>${b[0]}</h3>${b[1].map((q,i)=>`<div class="bank-q"><b>${i+1}.</b> ${fmt(q.q)}<br><span class="a">✔ ${fmt(q.c[0])}</span><br><small class="mut">ตัวลวง: ${q.c.slice(1).map(fmt).join(' | ')}</small></div>`).join('')}</div>`).join('');
 }else{
  body=`<div class="card" style="max-width:640px"><h3>⚙️ ตั้งค่ารายละเอียดวิชาและเกณฑ์การผ่าน</h3>
  <label>ชื่อรายวิชา</label><input id="setSubName" value="${esc(st.subjectName)}">
  <label>รหัสวิชา</label><input id="setSubCode" value="${esc(st.subjectCode)}">
  <label>ระดับชั้น</label><input id="setGrade" value="${esc(st.gradeLevel)}">
  <label>ชื่อหน่วยการเรียนรู้</label><input id="setUnit" value="${esc(st.unitName)}">
  <label>ชื่อ-นามสกุล ครูผู้สอน (แสดงบนเกียรติบัตร)</label><input id="setTeacher" value="${esc(st.teacherName)}">
  <label>ตำแหน่ง ครูผู้สอน</label><input id="setTeacherPos" value="${esc(st.teacherPos)}">
  <hr style="margin:20px 0;border:0;border-top:1px solid var(--bd)">
  <label>เกณฑ์ผ่านแบบทดสอบย่อย (5 ข้อ) – ร้อยละ</label><input id="setA" type="number" min="0" max="100" value="${st.passPct}">
  <label>เกณฑ์ผ่านแบบทดสอบประมวลความรู้ (10 ข้อ) – ร้อยละ</label><input id="setB" type="number" min="0" max="100" value="${st.finalPassPct}">
  <div style="margin-top:20px"><button class="btn" onclick="saveSettings()">💾 บันทึกการตั้งค่า</button></div></div>`;
 }
 view(adminHeader()+`<main class="wrap" style="max-width:1200px"><div class="tabs">${tabs}</div>${body}</main>`);
 if(ADMTAB==='students')fillAdminTable();
}

function stStatus(s){return s.cert?'cert':allSec(s)?'sec':'learn';}
function stLabel(s){const k=stStatus(s);return k==='cert'?'<span class="chip pass">🏅 ได้เกียรติบัตร</span>':k==='sec'?'<span class="chip go">รอสอบประมวล</span>':`<span class="chip lock">กำลังเรียน (${SECTIONS.filter(x=>passed(s,x.key)).length}/4)</span>`;}
function cell(s,k){const r=s.quizzes[k];if(!r)return '<span class="noc">–</span>';return `<span class="${r.passed?'okc':''}">${r.best}/${r.total}${r.passed?' ✔':''}</span><br><small class="mut">(${r.attempts} ครั้ง)</small>`;}
function fillAdminTable(){
 const q=(document.getElementById('admQ').value||'').toLowerCase(),f=document.getElementById('admF').value;
 const list=Object.values(DB.students).filter(s=>(s.name+' '+s.room).toLowerCase().includes(q)&&(!f||stStatus(s)===f))
  .sort((a,b)=>(a.room||'').localeCompare(b.room||'')||(+a.no||0)-(+b.no||0)||a.name.localeCompare(b.name,'th'));
 document.getElementById('admBody').innerHTML=list.length?list.map((s,i)=>`<tr><td>${i+1}</td><td class="l">${esc(s.name)}</td><td>${esc(s.room)}</td><td>${esc(s.no)}</td>${SECTIONS.map(x=>`<td>${cell(s,x.key)}</td>`).join('')}<td>${cell(s,'final')}</td><td>${stLabel(s)}</td><td><small>${thDT(s.updated)}</small></td>
 <td style="white-space:nowrap"><button class="btn sm ghost" onclick="stDetail('${encodeURIComponent(s.id)}')">ดู</button>${s.cert?`<button class="btn sm gold" onclick="renderCert(decodeURIComponent('${encodeURIComponent(s.id)}'),true)">🏅</button>`:''}<button class="btn sm bad" onclick="delSt('${encodeURIComponent(s.id)}')">ลบ</button></td></tr>`).join(''):'<tr><td colspan="12" class="mut">ยังไม่มีข้อมูลนักเรียน</td></tr>';
}
function stDetail(eid){
 const s=DB.students[decodeURIComponent(eid)];if(!s)return;
 const keys=[...SECTIONS.map(x=>[x.key,`ส่วนที่ ${x.no}`]),['final','ประมวลความรู้']];
 modal(`<h2>👤 ${esc(s.name)}</h2><p class="mut">ชั้น ${esc(s.room)||'-'} · เลขที่ ${esc(s.no)||'-'}<br>เข้าเรียนครั้งแรก ${thDT(s.created)} · ล่าสุด ${thDT(s.updated)}${s.cert?`<br>🏅 เกียรติบัตรเลขที่ ${s.cert.no} (${thDate(s.cert.date)})`:''}</p>
 ${keys.map(k=>{const r=s.quizzes[k[0]];return `<h4 style="margin:12px 0 4px">${k[1]}</h4>`+(r?`<table class="tb"><tr><th>ครั้ง</th><th>วันเวลา</th><th>คะแนน</th><th>รหัสชุด</th></tr>${r.history.map((h,i)=>`<tr><td>${i+1}</td><td>${thDT(h.d)}</td><td class="${h.pass?'okc':''}">${h.score}/${h.total}${h.pass?' ✔':''}</td><td><small>${h.code}</small></td></tr>`).join('')}</table>`:'<span class="mut">ยังไม่ได้สอบ</span>');}).join('')}
 <div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeModal()">ปิด</button></div>`);
}
function delSt(eid){const id=decodeURIComponent(eid),s=DB.students[id];if(!s)return;if(!confirm('ลบข้อมูลของ "'+s.name+'" ใช่หรือไม่?'))return;delete DB.students[id];saveDB();renderAdmin();toast('ลบข้อมูลแล้ว');}
function clearAll(){if(!confirm('ล้างข้อมูลนักเรียนทั้งหมดในเครื่องนี้?'))return;if(!confirm('ยืนยันอีกครั้ง: ข้อมูลจะหายถาวร'))return;DB.students={};saveDB();renderAdmin();toast('ล้างข้อมูลทั้งหมดแล้ว');}

function saveSettings(){
  DB.settings.subjectName=document.getElementById('setSubName').value.trim()||'คณิตศาสตร์เพิ่มเติม 6';
  DB.settings.subjectCode=document.getElementById('setSubCode').value.trim()||'ค33202';
  DB.settings.gradeLevel=document.getElementById('setGrade').value.trim()||'ชั้นมัธยมศึกษาปีที่ 6';
  DB.settings.unitName=document.getElementById('setUnit').value.trim()||'หน่วยการเรียนรู้ที่ 1 สถิติศาสตร์และข้อมูล';
  DB.settings.teacherName=document.getElementById('setTeacher').value.trim()||'จิรพันธ์ บัวแก้ว';
  DB.settings.teacherPos=document.getElementById('setTeacherPos').value.trim()||'ครูผู้สอน';
  DB.settings.passPct=Math.min(100,Math.max(0,+document.getElementById('setA').value||0));
  DB.settings.finalPassPct=Math.min(100,Math.max(0,+document.getElementById('setB').value||0));
  saveDB();
  toast('บันทึกการตั้งค่าเรียบร้อยแล้ว');
}

function exportCSV(){
 const st=DB.settings;
 const head=['ชื่อ-นามสกุล','ชั้น','เลขที่','ส่วนที่1 (สูงสุด/5)','ส่วนที่1 ครั้ง','ส่วนที่2 (สูงสุด/5)','ส่วนที่2 ครั้ง','ส่วนที่3 (สูงสุด/5)','ส่วนที่3 ครั้ง','ส่วนที่4 (สูงสุด/5)','ส่วนที่4 ครั้ง','ประมวล (สูงสุด/10)','ประมวล ครั้ง','สถานะ','เลขที่เกียรติบัตร','วันที่ผ่าน','เข้าเรียนครั้งแรก','ใช้งานล่าสุด'];
 const rows=Object.values(DB.students).map(s=>{const g=k=>s.quizzes[k]?[s.quizzes[k].best,s.quizzes[k].attempts]:['',''];const st=stStatus(s);
  return [s.name,s.room,s.no,...g('s1'),...g('s2'),...g('s3'),...g('s4'),...g('final'),st==='cert'?'ได้รับเกียรติบัตร':st==='sec'?'เรียนครบ รอสอบประมวล':'กำลังเรียน',s.cert?s.cert.no:'',s.cert?thDate(s.cert.date):'',thDT(s.created),thDT(s.updated)];});
 const csv='\uFEFF'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`ผลการเรียน_${st.subjectCode}_${st.unitName}.csv`;a.click();
}

/* ================== เครื่องมือทั่วไป ================== */
function modal(html){closeModal();document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal card">${html}</div></div>`);}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove();}
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function confetti(){const cs=['#f59e0b','#4f46e5','#22c55e','#ef4444','#0ea5e9','#ec4899'];for(let i=0;i<90;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%cs.length];d.style.animationDuration=(2+Math.random()*2.5)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5500);}}

/* ================== เริ่มต้น ================== */
if(sessionStorage.getItem('stat6_admin2')==='1')renderAdmin();
else if(ME&&DB.students[ME])goHome();
else renderLogin();
</script>
</body>
</html>
